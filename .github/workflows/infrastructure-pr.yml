name: Infrastructure - PR

# Runs on every PR into main. Every tier below is plan-only (never applies) and gets its
# plan + Infracost estimate posted as a PR comment, EXCEPT TempStaging: that's a real
# per-PR environment, applied here so a reviewer can exercise the actual feature, and torn
# down again once the PR closes.
#
# Every plan job declares `environment: <name>-plan` — an unprotected GitHub Environment
# with no required reviewers, used only to scope which AWS role/secrets it gets. Only
# TempStaging's apply job points at the real `tempstaging` environment. This split is what
# lets plan assume credentials without being gated by an approval it's supposed to inform.
#
# TempStaging's apply-tempstaging/destroy-tempstaging jobs assume github-actions-non-prod,
# not github-actions-apply — that role is main-branch-only. The non-prod role instead
# carries a TempStaging-scoped write carve-out (environment/shr-iam/github_actions.tf) so
# the one role can plan AND apply/destroy TempStaging from a PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  lint-snyk:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Terraform Lint
        uses: ./.github/actions/terraform-lint

      - name: Run Ansible Lint
        uses: ./.github/actions/ansible-lint

      - name: Run Snyk IaC scan
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

  # --- Shared account infra (shr-bootstrap, shr-iam) — plan only. Apply is manual by an
  # admin (shr-bootstrap creates the state bucket/lock table, shr-iam creates the OIDC
  # provider + the non-prod/apply roles themselves, so neither can safely auto-apply from
  # CI), but plan can run here since the non-prod role these jobs assume already exists
  # once shr-iam has been applied at least once. ---
  plan-shr:
    if: github.event.action != 'closed'
    needs: [lint-snyk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env_shr: [shr-bootstrap, shr-iam]
    environment: ${{ matrix.tf_env_shr }}-plan
    concurrency:
      group: plan-${{ matrix.tf_env_shr }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Only plan this tf_env if its own folder (or the pipeline itself) changed in
      # this PR — skips a needless plan+Infracost run when the diff is elsewhere.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/${{ matrix.tf_env_shr }}/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/${{ matrix.tf_env_shr }}
          env-name: ${{ matrix.tf_env_shr }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}

  # --- Staging: Global (bootstrap + admin — fixed set, not discovered) ---
  plan-staging-global:
    if: github.event.action != 'closed'
    needs: [lint-snyk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env: [stg-bootstrap, stg-admin]
    environment: staging-${{ matrix.tf_env }}-plan
    concurrency:
      group: plan-${{ matrix.tf_env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/${{ matrix.tf_env }}/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/${{ matrix.tf_env }}
          env-name: staging-${{ matrix.tf_env }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}

  # --- Prod: per-customer production. Customers are data, not directories in this repo —
  # the list is discovered from Secrets Manager (one secret per customer, named
  # oglh/customers/<code>), and every customer plans on every PR against the single
  # shared environment/prd-customer module, parameterized by customer_code. ---
  discover-customers:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      customers: ${{ steps.list.outputs.customers }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      - name: List customer codes from Secrets Manager (oglh/customers/<code>)
        id: list
        run: |
          customers=$(aws secretsmanager list-secrets --filter Key=name,Values="oglh/customers/" --output json \
            | jq -r '.SecretList[].Name | select(startswith("oglh/customers/")) | split("/") | last' \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=$customers" >> "$GITHUB_OUTPUT"

  plan-prod-customers:
    needs: [lint-snyk, discover-customers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.discover-customers.outputs.customers) }}
    environment: prod-${{ matrix.customer }}-plan
    concurrency:
      group: plan-prod-${{ matrix.customer }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_customer_code: ${{ matrix.customer }}
    steps:
      - uses: actions/checkout@v4

      # prd-customer is one shared module for every customer, so the check is against
      # the module folder itself, not per-customer.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/prd-customer/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Configure AWS credentials via OIDC
        if: steps.filter.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      # Region is data on the customer's secret (oglh/customers/<code>), same source as
      # customer_code. Falls back to us-east-1 for secrets not yet migrated to carry a
      # region field — see Multiple-Region-Setup-Detail.md Step 2, sub-step 4.
      - name: Read region for this customer
        id: region
        if: steps.filter.outputs.changed == 'true'
        run: |
          region=$(aws secretsmanager get-secret-value \
            --secret-id "oglh/customers/${{ matrix.customer }}" \
            --query 'SecretString' --output text | jq -r '.region // "us-east-1"')
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/prd-customer
          env-name: prod-${{ matrix.customer }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          backend-config: key=oglh/customers/${{ matrix.customer }}/terraform.tfstate
          region: ${{ steps.region.outputs.region }}

  # --- Prod: Global (bootstrap + admin — fixed set, not discovered) ---
  plan-prod-global:
    if: github.event.action != 'closed'
    needs: [lint-snyk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env_prod: [prd-bootstrap, prd-admin]
    environment: prod-${{ matrix.tf_env_prod }}-plan
    concurrency:
      group: plan-${{ matrix.tf_env_prod }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/${{ matrix.tf_env_prod }}/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/${{ matrix.tf_env_prod }}
          env-name: prod-${{ matrix.tf_env_prod }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}

  # --- Staging: Demo/Testing. These envs are data too — the list is discovered from
  # Secrets Manager (one secret per env, named oglh/stg/<name>), and every env plans
  # against the single shared environment/stg-customer module, parameterized by
  # env_name. ---
  discover-demo-envs:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      - name: List env names from Secrets Manager (oglh/stg/<name>)
        id: list
        run: |
          envs=$(aws secretsmanager list-secrets --filter Key=name,Values="oglh/stg/" --output json \
            | jq -r '.SecretList[].Name | select(startswith("oglh/stg/")) | split("/") | last' \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  plan-staging-demo:
    needs: [lint-snyk, discover-demo-envs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_cus: ${{ fromJSON(needs.discover-demo-envs.outputs.envs) }}
    environment: staging-${{ matrix.tf_cus }}-plan
    # Group name kept as "plan-tempstaging-<tf_cus>" to match the naming this tier was
    # specified with — worth double-checking this is intentional and not meant to be
    # "plan-staging-<tf_cus>", since as written it shares no group with the Staging Demo
    # apply step's own concurrency group over in infrastructure-main.yml.
    concurrency:
      group: plan-tempstaging-${{ matrix.tf_cus }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_env_name: ${{ matrix.tf_cus }}
    steps:
      - uses: actions/checkout@v4

      # stg-customer is one shared module for every demo env, so the check is against
      # the module folder itself, not per-env.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/stg-customer/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/stg-customer
          env-name: staging-${{ matrix.tf_cus }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          backend-config: key=envs/${{ matrix.tf_cus }}/terraform.tfstate

  # --- Staging: PR smoke test (TempStaging) — the only tier in this file that applies.
  # One environment per PR (not per app), state keyed by PR number so concurrent PRs never
  # collide, destroyed automatically if the PR closes without merging. Gated on
  # environment/tempstaging/** like every other tier — a PR that doesn't touch this
  # folder skips both the plan and the apply below. ---
  plan-tempstaging:
    if: github.event.action != 'closed'
    needs: [lint-snyk]
    runs-on: ubuntu-latest
    environment: tempstaging-plan
    concurrency:
      group: plan-tempstaging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # tempstaging/main.tf requires `pr_number` (used to key its backend and tag its
    # resources) — TF_VAR_* is how Terraform picks up a variable without every plan/apply/
    # destroy call in this file needing its own -var flag.
    env:
      TF_VAR_pr_number: ${{ github.event.pull_request.number }}
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'environment/tempstaging/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      - if: steps.filter.outputs.changed == 'true'
        uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/tempstaging
          env-name: tempstaging
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          backend-config: key=tempstaging/pr-${{ github.event.pull_request.number }}/terraform.tfstate

  # This and destroy-tempstaging below assume github-actions-non-prod, not
  # github-actions-apply — that role is main-branch-only (its trust policy requires
  # `ref = refs/heads/main` unconditionally, so a pull_request-triggered run can never
  # assume it). The non-prod role carries a TempStaging-scoped write carve-out instead
  # (see the TempStaging* statements on non_prod_access in environment/shr-iam/
  # github_actions.tf), which is what makes apply/destroy from a PR possible here at all.
  apply-tempstaging:
    needs: [plan-tempstaging]
    if: needs.plan-tempstaging.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: tempstaging
    concurrency:
      group: apply-tempstaging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_pr_number: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: environment/tempstaging
          env-name: tempstaging
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          backend-config: key=tempstaging/pr-${{ github.event.pull_request.number }}/terraform.tfstate
          run-ansible: "true"
          pr-number: ${{ github.event.pull_request.number }}

  # --- PR closed (merged or abandoned): tear TempStaging back down either way. ---
  destroy-tempstaging:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: tempstaging
    concurrency:
      group: tempstaging-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_pr_number: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-destroy
        with:
          working-directory: environment/tempstaging
          env-name: tempstaging
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          backend-config: key=tempstaging/pr-${{ github.event.pull_request.number }}/terraform.tfstate
          pr-number: ${{ github.event.pull_request.number }}

  # --- Final summary: one Slack message per PR run, built from the result of every
  # scan/plan/apply/destroy job above. `if: always()` so it still fires (and reports the
  # failure) even if an earlier job failed; a job skipped by its own `if:` (e.g. every plan
  # job on a `closed` PR event) shows up as "skipped", not as a false failure. ---
  notify:
    if: always() && !cancelled()
    needs:
      - lint-snyk
      - plan-shr
      - plan-staging-global
      - plan-prod-customers
      - plan-prod-global
      - plan-staging-demo
      - plan-tempstaging
      - apply-tempstaging
      - destroy-tempstaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build summary
        id: summary
        shell: bash
        run: |
          lint_snyk="${{ needs.lint-snyk.result }}"
          plan_shr="${{ needs.plan-shr.result }}"
          plan_staging_global="${{ needs.plan-staging-global.result }}"
          plan_staging_demo="${{ needs.plan-staging-demo.result }}"
          plan_prod_global="${{ needs.plan-prod-global.result }}"
          plan_prod_customers="${{ needs.plan-prod-customers.result }}"
          plan_tempstaging="${{ needs.plan-tempstaging.result }}"
          apply_tempstaging="${{ needs.apply-tempstaging.result }}"
          destroy_tempstaging="${{ needs.destroy-tempstaging.result }}"

          results=("$lint_snyk" "$plan_shr" "$plan_staging_global" "$plan_staging_demo" "$plan_prod_global" "$plan_prod_customers" "$plan_tempstaging" "$apply_tempstaging" "$destroy_tempstaging")
          all_skipped=true
          for r in "${results[@]}"; do
            [ "$r" = "skipped" ] || all_skipped=false
          done

          if [ "$apply_tempstaging" = "failure" ]; then
            headline="❌ Apply TempStaging failed"; color="danger"
          elif [ "$destroy_tempstaging" = "failure" ]; then
            headline="❌ Destroy TempStaging failed"; color="danger"
          elif [ "$plan_tempstaging" = "failure" ]; then
            headline="❌ Plan TempStaging failed"; color="danger"
          elif [ "$plan_prod_global" = "failure" ]; then
            headline="❌ Plan Prod Global failed"; color="danger"
          elif [ "$plan_prod_customers" = "failure" ]; then
            headline="❌ Plan Prod Customers failed"; color="danger"
          elif [ "$plan_staging_global" = "failure" ]; then
            headline="❌ Plan Staging Global failed"; color="danger"
          elif [ "$plan_staging_demo" = "failure" ]; then
            headline="❌ Plan Staging Demo failed"; color="danger"
          elif [ "$plan_shr" = "failure" ]; then
            headline="❌ Plan Shared failed"; color="danger"
          elif [ "$lint_snyk" = "failure" ]; then
            headline="❌ Lint/Snyk scan failed"; color="danger"
          elif [ "$all_skipped" = true ]; then
            headline="⏭️ All stages skipped"; color="#808080"
          elif [ "$apply_tempstaging" = "skipped" ]; then
            headline="⏭️ Apply TempStaging skipped (no TempStaging changes)"; color="good"
          else
            headline="✅ All stages passed"; color="good"
          fi
          echo "color=$color" >> "$GITHUB_OUTPUT"

          {
            echo "text<<EOF"
            echo "$headline"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "Infrastructure PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
          title-link: ${{ github.event.pull_request.html_url }}
          summary: ${{ steps.summary.outputs.text }}
          color: ${{ steps.summary.outputs.color }}
