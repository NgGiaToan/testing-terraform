name: Infrastructure - Main

# Runs on every push to main (right after a PR merges). Re-runs lint/Snyk, then promotes
# Staging -> Production per tier: every Staging leg (Demo/Testing + Global) must apply
# successfully before either Production leg (Global or per-customer) starts — a job-level
# `needs:` waits for the whole matrix job, not per leg, so both staging jobs are named in
# every prod job's `needs:`.
#
# As in infrastructure-pr.yml, every plan job points at an unprotected `<name>-plan`
# environment (for OIDC role/secrets only) while the matching apply job points at the real
# environment that carries the required-reviewers rule on production tiers.
on:
  push:
    branches: [main]

jobs:
  lint-snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Terraform Lint
        uses: ./.github/actions/terraform-lint

      - name: Run Ansible Lint
        uses: ./.github/actions/ansible-lint

      - name: Run Snyk IaC scan
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

  # --- Staging: Demo/Testing. These envs are data too — the list is discovered from
  # Secrets Manager (one secret per env, named oglh/stg/<name>), and every env applies
  # the single shared environment/stg-customer module, parameterized by env_name. ---
  discover-demo-envs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      - name: List env names from Secrets Manager (oglh/stg/<name>)
        id: list
        run: |
          envs=$(aws secretsmanager list-secrets --filter Key=name,Values="oglh/stg/" --output json \
            | jq -r '.SecretList[].Name | select(startswith("oglh/stg/")) | split("/") | last' \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  plan-staging-demo:
    needs: [lint-snyk, discover-demo-envs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_cus: ${{ fromJSON(needs.discover-demo-envs.outputs.envs) }}
    environment: staging-${{ matrix.tf_cus }}-plan
    # Group kept as "plan-tempstaging-<tf_cus>" to match this tier's spec — see the same
    # note in infrastructure-pr.yml's plan-staging-demo job.
    concurrency:
      group: plan-tempstaging-${{ matrix.tf_cus }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_env_name: ${{ matrix.tf_cus }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/stg-customer
          env-name: staging-${{ matrix.tf_cus }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          backend-config: key=envs/${{ matrix.tf_cus }}/terraform.tfstate

  apply-staging-demo:
    needs: [plan-staging-demo]
    strategy:
      fail-fast: false
      matrix:
        tf_cus: ${{ fromJSON(needs.discover-demo-envs.outputs.envs) }}
    runs-on: ubuntu-latest
    environment: staging-${{ matrix.tf_cus }}
    # Same group as the plan job above, per this tier's spec — queues apply behind plan
    # for the same tf_cus instead of racing it.
    concurrency:
      group: plan-tempstaging-${{ matrix.tf_cus }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_env_name: ${{ matrix.tf_cus }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: environment/stg-customer
          env-name: staging-${{ matrix.tf_cus }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-apply
          run-ansible: "true"
          backend-config: key=envs/${{ matrix.tf_cus }}/terraform.tfstate

  # --- Staging: Global (bootstrap + admin) — runs in parallel with the Demo/Testing tier
  # above, entirely independent of it. ---
  plan-staging-global:
    needs: [lint-snyk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env: [stg-bootstrap, stg-admin]
    environment: staging-${{ matrix.tf_env }}-plan
    concurrency:
      group: plan-staging-${{ matrix.tf_env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/${{ matrix.tf_env }}
          env-name: staging-${{ matrix.tf_env }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}

  apply-staging-global:
    needs: [plan-staging-global]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env: [stg-bootstrap, stg-admin]
    environment: staging-${{ matrix.tf_env }}
    concurrency:
      group: apply-staging-${{ matrix.tf_env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No Ansible step here, matching this tier's spec (only Staging Demo/Testing and
      # the Production tiers below run a playbook after apply).
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: environment/${{ matrix.tf_env }}
          env-name: staging-${{ matrix.tf_env }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-apply

  # --- Production: Global (bootstrap + admin). Gated on BOTH Staging legs above having
  # fully applied — a job-level `needs:` waits for the whole matrix, not per leg. ---
  plan-prod-global:
    needs: [apply-staging-demo, apply-staging-global]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env_prod: [prd-bootstrap, prd-admin]
    environment: prod-${{ matrix.tf_env_prod }}-plan
    concurrency:
      group: plan-prod-${{ matrix.tf_env_prod }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/${{ matrix.tf_env_prod }}
          env-name: prod-${{ matrix.tf_env_prod }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}

  apply-prod-global:
    needs: [plan-prod-global]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf_env_prod: [prd-bootstrap, prd-admin]
    # The required-reviewers rule for this promotion belongs on this environment.
    environment: prod-${{ matrix.tf_env_prod }}
    concurrency:
      group: apply-prod-${{ matrix.tf_env_prod }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: environment/${{ matrix.tf_env_prod }}
          env-name: prod-${{ matrix.tf_env_prod }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-apply

  # --- Production: per-customer. Customers are data, not directories in this repo — the
  # list is discovered from Secrets Manager (one secret per customer, named
  # oglh/customers/<code>), and every customer applies the single shared
  # environment/prd-customer module, parameterized by customer_code. Also gated on both
  # Staging legs. ---
  discover-customers:
    needs: [apply-staging-demo, apply-staging-global]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      customers: ${{ steps.list.outputs.customers }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      - name: List customer codes from Secrets Manager (oglh/customers/<code>)
        id: list
        run: |
          customers=$(aws secretsmanager list-secrets --filter Key=name,Values="oglh/customers/" --output json \
            | jq -r '.SecretList[].Name | select(startswith("oglh/customers/")) | split("/") | last' \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=$customers" >> "$GITHUB_OUTPUT"

  plan-prod-customers:
    needs: [discover-customers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.discover-customers.outputs.customers) }}
    environment: prod-${{ matrix.customer }}-plan
    concurrency:
      group: plan-prod-${{ matrix.customer }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_customer_code: ${{ matrix.customer }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          aws-region: us-east-1

      # Region is data on the customer's secret (oglh/customers/<code>), same source as
      # customer_code. Falls back to us-east-1 for secrets not yet migrated to carry a
      # region field — see Multiple-Region-Setup-Detail.md Step 2, sub-step 4.
      - name: Read region for this customer
        id: region
        run: |
          region=$(aws secretsmanager get-secret-value \
            --secret-id "oglh/customers/${{ matrix.customer }}" \
            --query 'SecretString' --output text | jq -r '.region // "us-east-1"')
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/terraform-plan-cost
        with:
          working-directory: environment/prd-customer
          env-name: prod-${{ matrix.customer }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-non-prod
          infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
          backend-config: key=oglh/customers/${{ matrix.customer }}/terraform.tfstate
          region: ${{ steps.region.outputs.region }}

  apply-prod-customers:
    needs: [plan-prod-customers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.discover-customers.outputs.customers) }}
    environment: prod-${{ matrix.customer }}
    concurrency:
      group: apply-prod-${{ matrix.customer }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      TF_VAR_customer_code: ${{ matrix.customer }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: environment/prd-customer
          env-name: prod-${{ matrix.customer }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-apply
          run-ansible: "true"
          backend-config: key=oglh/customers/${{ matrix.customer }}/terraform.tfstate

      # Any other run still sitting in "Waiting" for this same prod-<customer> approval is
      # now stale — this apply just moved that customer's prod state past it, so approving
      # it later would only hit Terraform's own "Saved plan is stale" error.
      - name: Cancel other runs waiting on this customer's prod approval
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ENVIRONMENT: prod-${{ matrix.customer }}
        run: |
          for run_id in $(gh api "repos/${{ github.repository }}/actions/runs?status=waiting" --jq '.workflow_runs[].id'); do
            if [ "$run_id" = "${{ github.run_id }}" ]; then
              continue
            fi
            is_match=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/pending_deployments" --jq '.[].environment.name' | grep -xqF "$APP_ENVIRONMENT" && echo yes || echo no)
            if [ "$is_match" = "yes" ]; then
              echo "Cancelling run $run_id — superseded, still waiting on $APP_ENVIRONMENT approval"
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/cancel"
            fi
          done

  deploy-complete:
    needs: [apply-prod-global, apply-prod-customers]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Deploy complete" >> "$GITHUB_STEP_SUMMARY"

  # --- Final summary: one Slack message per push-to-main run, built from the result of
  # every scan/plan/apply job above. `if: always()` so it still fires (and reports the
  # failure) even if an earlier job failed — that's the whole point of a deploy notification. ---
  notify:
    if: always() && !cancelled()
    needs:
      - lint-snyk
      - plan-staging-demo
      - apply-staging-demo
      - plan-staging-global
      - apply-staging-global
      - plan-prod-global
      - apply-prod-global
      - plan-prod-customers
      - apply-prod-customers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build summary
        id: summary
        shell: bash
        run: |
          lint_snyk="${{ needs.lint-snyk.result }}"
          plan_staging_demo="${{ needs.plan-staging-demo.result }}"
          apply_staging_demo="${{ needs.apply-staging-demo.result }}"
          plan_staging_global="${{ needs.plan-staging-global.result }}"
          apply_staging_global="${{ needs.apply-staging-global.result }}"
          plan_prod_global="${{ needs.plan-prod-global.result }}"
          apply_prod_global="${{ needs.apply-prod-global.result }}"
          plan_prod_customers="${{ needs.plan-prod-customers.result }}"
          apply_prod_customers="${{ needs.apply-prod-customers.result }}"

          results=("$lint_snyk" "$plan_staging_demo" "$apply_staging_demo" "$plan_staging_global" "$apply_staging_global" "$plan_prod_global" "$apply_prod_global" "$plan_prod_customers" "$apply_prod_customers")
          all_skipped=true
          for r in "${results[@]}"; do
            [ "$r" = "skipped" ] || all_skipped=false
          done

          if [ "$apply_prod_customers" = "failure" ]; then
            headline="❌ Apply Prod Customers failed"; color="danger"
          elif [ "$apply_prod_global" = "failure" ]; then
            headline="❌ Apply Prod Global failed"; color="danger"
          elif [ "$apply_staging_global" = "failure" ]; then
            headline="❌ Apply Staging Global failed"; color="danger"
          elif [ "$apply_staging_demo" = "failure" ]; then
            headline="❌ Apply Staging Demo failed"; color="danger"
          elif [ "$plan_prod_customers" = "failure" ]; then
            headline="❌ Plan Prod Customers failed"; color="danger"
          elif [ "$plan_prod_global" = "failure" ]; then
            headline="❌ Plan Prod Global failed"; color="danger"
          elif [ "$plan_staging_global" = "failure" ]; then
            headline="❌ Plan Staging Global failed"; color="danger"
          elif [ "$plan_staging_demo" = "failure" ]; then
            headline="❌ Plan Staging Demo failed"; color="danger"
          elif [ "$lint_snyk" = "failure" ]; then
            headline="❌ Lint/Snyk scan failed"; color="danger"
          elif [ "$all_skipped" = true ]; then
            headline="⏭️ All stages skipped"; color="#808080"
          else
            headline="✅ All stages passed"; color="good"
          fi
          echo "color=$color" >> "$GITHUB_OUTPUT"

          {
            echo "text<<EOF"
            echo "$headline"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "Infrastructure Main — ${{ github.sha }}"
          title-link: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          summary: ${{ steps.summary.outputs.text }}
          color: ${{ steps.summary.outputs.color }}
