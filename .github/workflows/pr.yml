name: PR Checks

# Runs on every pull request into main: shared lint/security/plan checks (checks.yml),
# plus the PR-only cost estimate. Never touches real infrastructure — terraform-plan
# (inside checks.yml) only plans, it never applies.
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  infracost:
    runs-on: ubuntu-latest
    needs: [checks]
    if: needs.checks.outputs.dev_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.checks.outputs.dev_matrix) }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: environment/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost estimate
        run: infracost breakdown --path=. --format=json --out-file=infracost.json

      - name: Post Infracost comment
        run: |
          infracost comment github --path=infracost.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --tag=${{ matrix.env }} \
            --behavior=update
