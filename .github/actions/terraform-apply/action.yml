name: "Terraform Apply"
description: "Assume the apply role, download the reviewed plan artifact, apply it verbatim, and optionally run the Ansible playbook against the result"

inputs:
  working-directory:
    description: "Directory containing the Terraform config to apply"
    required: true
  env-name:
    description: "Environment name matching the tfplan-bin-<env-name> artifact produced by terraform-plan"
    required: true
  role-arn:
    description: "ARN of the read-write apply role to assume via OIDC"
    required: true
  backend-config:
    description: "Passed through to `terraform init -backend-config=...`"
    required: false
    default: ""
  run-ansible:
    description: "Run ansible-playbook against this environment after apply"
    required: false
    default: "false"
  ansible-directory:
    description: "Directory containing the Ansible playbook"
    required: false
    default: "ansible"

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.backend-config }}" ]; then
          terraform init -backend-config="${{ inputs.backend-config }}"
        else
          terraform init
        fi

    - name: Download reviewed plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-bin-${{ inputs.env-name }}
        path: ${{ inputs.working-directory }}

    - name: Terraform Apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform apply -no-color tfplan

    - name: Install Ansible
      if: inputs.run-ansible == 'true'
      shell: bash
      run: pip install --user ansible-core

    - name: Run Ansible playbook (${{ inputs.env-name }})
      if: inputs.run-ansible == 'true'
      shell: bash
      working-directory: ${{ inputs.ansible-directory }}
      run: ansible-playbook playbook.yml
