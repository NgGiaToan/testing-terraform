name: "Terraform Apply"
description: "Assume the apply role, download the reviewed plan artifact, apply it verbatim, and optionally run the Ansible playbook against the result"

inputs:
  working-directory:
    description: "Directory containing the Terraform config to apply"
    required: true
  env-name:
    description: "Environment name matching the tfplan-bin-<env-name> artifact produced by terraform-plan"
    required: true
  role-arn:
    description: "ARN of the role to assume via OIDC that grants write access for this environment (github-actions-apply for most environments, github-actions-non-prod for TempStaging)"
    required: true
  backend-config:
    description: "Passed through to `terraform init -backend-config=...`"
    required: false
    default: ""
  run-ansible:
    description: "Run ansible-playbook against this environment after apply"
    required: false
    default: "false"
  ansible-directory:
    description: "Directory containing the Ansible playbook"
    required: false
    default: "ansible"
  pr-number:
    description: "PR number to comment on. Leave empty for push-to-main runs — with no PR to comment on, results go to the job summary instead."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.backend-config }}" ]; then
          terraform init -backend-config="${{ inputs.backend-config }}"
        else
          terraform init
        fi

    - name: Download reviewed plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-bin-${{ inputs.env-name }}
        path: ${{ inputs.working-directory }}

    - name: Terraform Apply
      id: apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        terraform apply -no-color tfplan | tee apply_output.txt
        exit_code=${PIPESTATUS[0]}
        {
          echo "output<<EOF"
          cat apply_output.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        exit $exit_code
      continue-on-error: true

    - name: Comment apply result on PR
      if: inputs.pr-number != ''
      uses: actions/github-script@v7
      env:
        ENV_NAME: ${{ inputs.env-name }}
        APPLY_OUTPUT: ${{ steps.apply.outputs.output }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        script: |
          const icon = process.env.APPLY_OUTCOME === 'success' ? '✅' : '❌';

          const output = `### Terraform Apply — ${process.env.ENV_NAME}
          #### ${icon} Apply: \`${process.env.APPLY_OUTCOME}\`

          <details><summary>Show apply output</summary>

          \`\`\`terraform
          ${process.env.APPLY_OUTPUT}
          \`\`\`

          </details>`;

          github.rest.issues.createComment({
            issue_number: Number(process.env.PR_NUMBER),
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

    - name: Publish apply result to job summary
      if: inputs.pr-number == ''
      shell: bash
      env:
        ENV_NAME: ${{ inputs.env-name }}
        APPLY_OUTPUT: ${{ steps.apply.outputs.output }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        if [ "$APPLY_OUTCOME" = "success" ]; then
          icon="✅"
        else
          icon="❌"
        fi
        {
          echo "### Terraform Apply — $ENV_NAME"
          echo "#### ${icon} Apply: \`$APPLY_OUTCOME\`"
          echo
          echo "<details><summary>Show apply output</summary>"
          echo
          echo '```terraform'
          printf '%s\n' "$APPLY_OUTPUT"
          echo '```'
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if apply failed
      if: steps.apply.outcome == 'failure'
      shell: bash
      run: exit 1
