name: "Terraform Destroy"
description: "Assume the write role and destroy this environment's Terraform-managed infrastructure"

inputs:
  working-directory:
    description: "Directory containing the Terraform config to destroy"
    required: true
  env-name:
    description: "Environment name, used in comments and the job summary"
    required: true
  role-arn:
    description: "ARN of the role to assume via OIDC that grants write access for this environment"
    required: true
  backend-config:
    description: "Passed through to `terraform init -backend-config=...`"
    required: false
    default: ""
  pr-number:
    description: "PR number to comment on. Leave empty for runs with no PR to comment on — results go to the job summary instead."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.backend-config }}" ]; then
          terraform init -backend-config="${{ inputs.backend-config }}"
        else
          terraform init
        fi

    - name: Terraform Destroy
      id: destroy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        terraform destroy -no-color -auto-approve | tee destroy_output.txt
        exit_code=${PIPESTATUS[0]}
        {
          echo "output<<EOF"
          cat destroy_output.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        exit $exit_code
      continue-on-error: true

    - name: Comment destroy result on PR
      if: inputs.pr-number != ''
      uses: actions/github-script@v7
      env:
        ENV_NAME: ${{ inputs.env-name }}
        DESTROY_OUTPUT: ${{ steps.destroy.outputs.output }}
        DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        script: |
          const icon = process.env.DESTROY_OUTCOME === 'success' ? '✅' : '❌';

          const output = `### Terraform Destroy — ${process.env.ENV_NAME}
          #### ${icon} Destroy: \`${process.env.DESTROY_OUTCOME}\`

          <details><summary>Show destroy output</summary>

          \`\`\`terraform
          ${process.env.DESTROY_OUTPUT}
          \`\`\`

          </details>`;

          github.rest.issues.createComment({
            issue_number: Number(process.env.PR_NUMBER),
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

    - name: Publish destroy result to job summary
      if: inputs.pr-number == ''
      shell: bash
      env:
        ENV_NAME: ${{ inputs.env-name }}
        DESTROY_OUTPUT: ${{ steps.destroy.outputs.output }}
        DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
      run: |
        if [ "$DESTROY_OUTCOME" = "success" ]; then
          icon="✅"
        else
          icon="❌"
        fi
        {
          echo "### Terraform Destroy — $ENV_NAME"
          echo "#### ${icon} Destroy: \`$DESTROY_OUTCOME\`"
          echo
          echo "<details><summary>Show destroy output</summary>"
          echo
          echo '```terraform'
          printf '%s\n' "$DESTROY_OUTPUT"
          echo '```'
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if destroy failed
      if: steps.destroy.outcome == 'failure'
      shell: bash
      run: exit 1
