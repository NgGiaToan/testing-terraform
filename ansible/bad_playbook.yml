---
- name: Playbook with code smells for testing scanners
  hosts: all

  tasks:
    - name: Create app directory a
      ansible.builtin.file:
        path: /opt/app_a
        state: directory
        mode: "0755"

    - name: Create app directory b
      ansible.builtin.file:
        path: /opt/app_b
        state: directory
        mode: "0755"

    - name: Create app directory c
      ansible.builtin.file:
        path: /opt/app_c
        state: directory
        mode: "0755"

    # TODO: collapse these three duplicated tasks into a loop with a list of paths
    # TODO: revisit directory layout later
    # FIXME: copy-pasted three times, needs a with_items/loop refactor

    - name: Print completion message
      ansible.builtin.debug:
        msg: "app directories created"

    # Intentional lint violations for testing the ansible-lint CI job:
    # - name[missing]: no `name:` key
    # - no-changed-when: command with no changed_when
    # - command-instead-of-module: rm via command instead of ansible.builtin.file
    - command: rm -rf /opt/tmp_cache
