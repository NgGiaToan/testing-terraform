---
# Handlers run at the end of the play, in the order written here: systemd first, then Grafana, then the data sources.
# The token is not a handler: tasks/aws_federation.yml fetches and checks it BEFORE Grafana is touched.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd:
    name: "{{ grafana_service_name }}"
    state: restarted

- name: Reload grafana datasources
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/admin/provisioning/datasources/reload"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: grafana_reload
  retries: 5
  delay: 3
  until: grafana_reload.status == 200
